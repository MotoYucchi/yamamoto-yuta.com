name: Deploy to GitHub Pages

on:
  # mainブランチにpushされた時に自動で実行
  push:
    branches: [ "main" ]
  # GitHub Actionsの画面から手動で実行できるようにする設定
  workflow_dispatch:

# GitHub Pagesへデプロイするための権限設定
permissions:
  contents: read
  pages: write
  id-token: write

# 複数デプロイが同時に走らないようにする設定
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # 1. ビルド作業を行うジョブ
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Node.jsのセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20' # LTSバージョンを使用

      - name: 依存関係のインストール
        run: npm install

      - name: 静的サイトのビルド
        run: npm run build

      - name: GitHub Pages用アーティファクトのアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          # ビルドスクリプトの出力先を指定
          path: './public'

  # 2. 実際にデプロイするジョブ
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build # buildジョブが終わってから実行する
    steps:
      - name: GitHub Pagesへのデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
